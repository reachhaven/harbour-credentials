[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harbour-credentials"
version = "1.0.0"
description = "JOSE signing and verification for Harbour Verifiable Credentials (ES256/P-256)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "EPL-2.0" }
authors = [
    { name = "Reachhaven", email = "info@reachhaven.com" }
]
keywords = ["verifiable-credentials", "jose", "jws", "es256", "p256", "sd-jwt", "did", "json-ld"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Eclipse Public License 2.0 (EPL-2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    "joserfc>=1.0.0",
    "cryptography>=44.0.0",
    "base58>=2.1.0",
    "pycryptodome>=3.20",
    "rfc8785>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.0",
    "pre-commit==4.5.1",
    "pytest>=8.0.0",
    "pytest-cov>=6.0",
    "rdflib>=7.0.0",
    # LinkML compiler — ASCS-eV fork (feat/envited-x-pipeline). Installed directly
    # from git so no submodule/recursive clone is required to run `just generate`.
    # Mirrors ontology-management-base's own [dev] pin (single source of truth for
    # the compiler version).
    "linkml @ git+https://github.com/ASCS-eV/linkml.git@feat/envited-x-pipeline#subdirectory=packages/linkml",
    # Required by the fork's OWL generator (linkml.utils.rdf_canonicalize) but not
    # declared as a hard dependency there.
    "pyoxigraph>=0.4",
    # ontology-management-base — the `omb` package that ships the committed
    # Gaia-X `artifacts/gx/*` shapes and the SHACL validation suite consumed by
    # `just validate-shacl`. Installed editable from the flat submodule via the
    # [tool.uv.sources] entry below (no recursive submodule clone required).
    "ontology-management-base",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.0",
]

[project.urls]
Homepage = "https://github.com/reachhaven/harbour-credentials"
Repository = "https://github.com/reachhaven/harbour-credentials.git"
Issues = "https://github.com/reachhaven/harbour-credentials/issues"

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["harbour*", "credentials*"]

# uv dependency sources. The ontology-management-base (`omb`) package is resolved
# from the flat submodule and installed editable, replacing the old
# `pip install -e submodules/ontology-management-base` step. The LinkML fork stays
# an inline git reference in the [dev] extra above (single source of truth for the
# compiler version, mirroring OMB's own [dev] pin).
[tool.uv.sources]
ontology-management-base = { path = "submodules/ontology-management-base", editable = true }

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".git", ".venv", "build", "dist", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["harbour", "credentials"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/python"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/python/harbour", "src/python/credentials"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
