name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'mkdocs.yml'
      - '.github/workflows/cd-docs.yml'

  workflow_dispatch:

  workflow_call:
    inputs:
      ref:
        description: "The branch, tag or SHA to checkout (optional)"
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: 🔨 Build Documentation
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          submodules: true

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install TypeScript dependencies
        working-directory: src/typescript/harbour
        run: corepack yarn install --immutable

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build MkDocs site
        run: uv run --frozen --extra docs mkdocs build --strict --site-dir site

      - name: Generate TypeScript API docs into site
        working-directory: src/typescript/harbour
        run: npx typedoc --out ../../../site/api/typescript-generated index.ts --skipErrorChecking

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
